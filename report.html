<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3riplethreat — Pitcher Analytics Report</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@page { size: letter portrait; margin: 0.4in; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; font-family:'DM Mono',monospace; background:#fff; color:#0c4a6e; }
#controlbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px 16px; background:#0c4a6e; border-bottom:2px solid #06b6d4;
  position:fixed; top:0; left:0; width:100%; z-index:1000;
}
#controlbar button{
  padding:8px 20px; font-family:'Bebas Neue',sans-serif; font-size:14px;
  letter-spacing:2px; cursor:pointer; border-radius:6px; border:none;
  background:#06b6d4; color:#fff;
}
#controlbar .info{ font-family:'DM Mono',monospace; font-size:10px; color:#bae6fd; }
#pages{ padding-top:56px; }
.page{
  width:8.5in; min-height:11in; page-break-after:always;
  page-break-inside:avoid; padding:0.4in; box-sizing:border-box;
  background:#fff; margin:0 auto; display:flex; flex-direction:column;
}
.page:last-child{ page-break-after:auto; }
.page-header{
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:2px solid #0c4a6e; padding-bottom:10px; margin-bottom:16px;
}
.page-header-left{ display:flex; align-items:center; gap:12px; }
.page-header img{ height:48px; }
.page-header-titles{ display:flex; flex-direction:column; }
.report-title{
  font-family:'Bebas Neue',sans-serif; font-size:22px;
  letter-spacing:3px; color:#0c4a6e;
}
.report-subtitle{ font-size:9px; color:#5a8aaa; letter-spacing:1px; }
.page-header-right{ text-align:right; font-size:9px; color:#5a8aaa; }
.section-label{
  font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px;
  color:#0c4a6e; border-bottom:1px solid #bae6fd; padding-bottom:4px;
  margin:14px 0 8px 0;
}
.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.stat-box{
  background:#f0f9ff; border:1px solid #7dd3fc; border-radius:6px;
  padding:8px; text-align:center;
}
.stat-value{
  font-family:'Bebas Neue',sans-serif; font-size:28px; color:#0c4a6e;
}
.stat-label{ font-size:7px; color:#0c4a6e; letter-spacing:1px; font-weight:600; }
.pitch-row{ display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.pitch-label{ font-size:9px; color:#0c4a6e; width:40px; flex-shrink:0; font-weight:700; }
.pitch-bar-wrap{ flex:1; background:#bae6fd; border-radius:2px; height:12px; }
.pitch-bar-fill{ height:100%; border-radius:2px; }
.pitch-pct{ font-size:9px; color:#0c4a6e; width:52px; text-align:right; flex-shrink:0; font-weight:700; }
.zone-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; width:2.5in; margin:0 auto 8px auto; }
.zone-cell{
  height:0.6in; border-radius:3px; display:flex; align-items:center;
  justify-content:center; font-size:11px; font-weight:700;
  border:1px solid #bae6fd;
}
@media print{
  .zone-cell{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .pitch-bar-fill{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .stat-box{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .pattern-item{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.heat-title{ font-size:10px; color:#0c4a6e; font-weight:700; text-align:center; margin-bottom:4px; }
.count-row{
  display:flex; justify-content:space-between; font-size:9px;
  color:#0c4a6e; font-weight:600; padding:3px 0;
  border-bottom:0.5px solid #e0f2fe;
}
.pattern-item{
  font-size:9px; color:#0c4a6e; font-weight:600;
  padding:3px 6px; border-left:3px solid #0c4a6e;
  background:#f0f9ff; margin-bottom:3px; line-height:1.4;
}
.footer{
  margin-top:auto; padding-top:10px; border-top:0.5px solid #bae6fd;
  font-size:8px; color:#5a8aaa; display:flex; justify-content:space-between;
}
@media print{
  #controlbar{ display:none; }
  #pages{ padding-top:0; }
  .page{ margin:0; }
}
</style>
</head>
<body>
<div id="controlbar">
  <button onclick="window.print()">🖨 PRINT / SAVE AS PDF</button>
  <div class="info" id="report-info">Loading report...</div>
</div>
<div id="pages"></div>
<script>
const PITCH_COLORS={
  '4FB':'#dc2626','2FB':'#ea580c','CB':'#2563eb','SL':'#9333ea',
  'CH':'#16a34a','CT':'#ca8a04','SP':'#0891b2','SK':'#e11d48',
  'FK':'#7c3aed','SCR':'#db2777','EPH':'#334155','SLV':'#6d28d9',
  'SWP':'#059669','KN':'#334155','KC':'#4f46e5'
};
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}
function formatDate(ts){
  if(!ts) return '';
  const d=new Date(ts);
  return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
}
function pageHeader(reportType,profile,date){
  return '<div class="page-header">'
    +'<div class="page-header-left">'
    +'<img src="assets/3riplethreat-logo.png" alt="3riplethreat">'
    +'<div class="page-header-titles">'
    +'<div class="report-title">PITCHER ANALYTICS REPORT</div>'
    +'<div class="report-subtitle">'+(reportType||'')+'</div>'
    +'</div></div>'
    +'<div class="page-header-right">'
    +(profile?'<div style="font-weight:700;color:#0c4a6e;font-size:11px;">'+profile.name+'</div>':'')
    +(profile?'<div>'+profile.ageGroup+' · Max '+profile.maxVelocity+' mph</div>':'')
    +'<div>'+formatDate(date)+'</div>'
    +'</div></div>';
}
function pageFooter(page,total){
  return '<div class="footer">'
    +'<span>3riplethreat Analytics Training — Confidential</span>'
    +'<span>Page '+page+' of '+total+'</span>'
    +'</div>';
}
function statBox(label,value,color){
  return '<div class="stat-box">'
    +'<div class="stat-value" style="color:'+(color||'#0c4a6e')+';">'+value+'</div>'
    +'<div class="stat-label">'+label+'</div>'
    +'</div>';
}
function pitchMixHTML(pitchMix){
  const total=Object.values(pitchMix||{}).reduce(function(a,b){return a+b;},0)||1;
  return Object.entries(pitchMix||{}).sort(function(a,b){return b[1]-a[1];}).map(function(e){
    const pk=e[0],cnt=e[1];
    const pct=Math.round(cnt/total*100);
    return '<div class="pitch-row">'
      +'<div class="pitch-label">'+pk+'</div>'
      +'<div class="pitch-bar-wrap"><div class="pitch-bar-fill" style="width:'+pct+'%;background:'+(PITCH_COLORS[pk]||'#334155')+'"></div></div>'
      +'<div class="pitch-pct">'+cnt+' ('+pct+'%)</div>'
      +'</div>';
  }).join('');
}
function zoneHeatMapHTML(zoneMap,maxVal){
  const zoneOrder=[['TR','TM','TL'],['MR','MM','ML'],['BR','BM','BL']];
  const max=maxVal||Math.max.apply(null,['TL','TM','TR','ML','MM','MR','BL','BM','BR'].map(function(z){return zoneMap[z]||0;}))||1;
  return '<div class="zone-grid">'
    +zoneOrder.map(function(row){
      return row.map(function(zk){
        const cnt=zoneMap[zk]||0;
        const intensity=cnt/max;
        return '<div class="zone-cell" style="background:rgba(220,38,38,'+Math.max(0.05,intensity)+');color:'+(intensity>0.4?'#fff':'#334155')+'">'+(cnt>0?cnt:'')+'</div>';
      }).join('');
    }).join('')
    +'</div>';
}
function handHeatMapsHTML(vsLHB,vsRHB){
  return '<div class="two-col">'
    +'<div><div class="heat-title">VS LHB</div>'+zoneHeatMapHTML((vsLHB&&vsLHB.zoneMap)||{})+'</div>'
    +'<div><div class="heat-title">VS RHB</div>'+zoneHeatMapHTML((vsRHB&&vsRHB.zoneMap)||{})+'</div>'
    +'</div>';
}
function buildGameReport(data){
  const game=data.game;
  const profile=data.profile;
  if(!game) return '<div style="padding:40px;text-align:center;color:#991b1b;">No game data available.</div>';
  const pages=document.getElementById('pages');
  // Page 1: Summary + Pitch Mix + Zone Heat Map
  const p1=document.createElement('div');
  p1.className='page';
  p1.innerHTML=pageHeader('GAME REPORT',profile,data.generatedAt)
    +'<div class="section-label">GAME SUMMARY</div>'
    +'<div class="stat-grid">'
    +statBox('PITCHES',game.pitchCount,'#0c4a6e')
    +statBox('STRIKEOUTS',game.strikeouts,'#166534')
    +statBox('WALKS',game.walks,'#991b1b')
    +statBox('HITS',game.hits,'#92400e')
    +statBox('RUNS',game.runsAllowed,'#991b1b')
    +statBox('INNINGS',game.innings,'#0891b2')
    +'</div>'
    +'<div class="section-label">PITCH MIX</div>'
    +pitchMixHTML(game.pitchMix)
    +'<div class="section-label">ZONE HEAT MAP</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:4px;">'
    +'<span style="font-size:8px;display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:10px;height:10px;background:#dc2626;border-radius:2px;"></span>IN ZONE</span>'
    +'<span style="font-size:8px;display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:10px;height:10px;background:#d97706;border-radius:2px;"></span>EDGE</span>'
    +'<span style="font-size:8px;display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:10px;height:10px;background:#2563eb;border-radius:2px;"></span>CHASE</span>'
    +'</div>'
    +zoneHeatMapHTML(game.zoneMap||{})
    +pageFooter(1,3);
  pages.appendChild(p1);
  // Page 2: Count Tendencies + Pattern Alerts + Strikeout Pitch Selection
  const p2=document.createElement('div');
  p2.className='page';
  const counts=['0-0','0-1','0-2','1-0','1-1','1-2','2-0','2-1','2-2','3-0','3-1','3-2'];
  const countHTML=counts.map(function(ct){
    const ctData=game.countTendencies&&game.countTendencies[ct];
    if(!ctData) return '';
    const top=Object.entries(ctData).sort(function(a,b){return b[1]-a[1];})[0];
    if(!top) return '';
    return '<div class="count-row"><span>COUNT '+ct+'</span><span style="color:'+(PITCH_COLORS[top[0]]||'#0c4a6e')+'">'+top[0]+' ('+top[1]+'x)</span></div>';
  }).join('');
  // Pattern alerts
  const totalP=Object.values(game.pitchMix||{}).reduce(function(a,b){return a+b;},0)||1;
  const alerts=[];
  const fp=game.firstPitches||{};
  const fpTotal=Object.values(fp).reduce(function(a,b){return a+b;},0)||1;
  const fpFB=(fp['4FB']||0)+(fp['2FB']||0)+(fp['SK']||0)+(fp['CT']||0);
  if(fpFB/fpTotal>0.70) alerts.push('⚠ '+Math.round(fpFB/fpTotal*100)+'% fastball first pitch — predictable opener');
  const topPitch=Object.entries(game.pitchMix||{}).sort(function(a,b){return b[1]-a[1];})[0];
  if(topPitch&&topPitch[1]/totalP>0.55) alerts.push('⚠ '+topPitch[0]+' used '+Math.round(topPitch[1]/totalP*100)+'% of time — over-reliance');
  if(!alerts.length) alerts.push('✓ No major patterns detected — good variety!');
  // Strikeout pitch selection
  const soByPitch={};
  Object.entries(game.outcomes||{}).forEach(function(e){
    if(e[1]['STRIKEOUT']) soByPitch[e[0]]=(soByPitch[e[0]]||0)+e[1]['STRIKEOUT'];
  });
  const soTotal=Object.values(soByPitch).reduce(function(a,b){return a+b;},0)||1;
  const soHTML=Object.entries(soByPitch).sort(function(a,b){return b[1]-a[1];}).map(function(e){
    const pk=e[0],cnt=e[1],pct=Math.round(cnt/soTotal*100);
    return '<div class="pitch-row">'
      +'<div class="pitch-label">'+pk+'</div>'
      +'<div class="pitch-bar-wrap"><div class="pitch-bar-fill" style="width:'+pct+'%;background:'+(PITCH_COLORS[pk]||'#334155')+'"></div></div>'
      +'<div class="pitch-pct">'+cnt+' K ('+pct+'%)</div>'
      +'</div>';
  }).join('');
  p2.innerHTML=pageHeader('GAME REPORT',profile,data.generatedAt)
    +'<div class="section-label">COUNT TENDENCIES</div>'
    +countHTML
    +'<div class="section-label">PATTERN ALERTS</div>'
    +alerts.map(function(a){return '<div class="pattern-item">'+a+'</div>';}).join('')
    +'<div class="section-label">STRIKEOUT PITCH SELECTION</div>'
    +(soHTML||'<div style="font-size:9px;color:#475569;">No strikeouts recorded.</div>')
    +pageFooter(2,3);
  pages.appendChild(p2);
  // Page 3: VS LHB/RHB heat maps
  const p3=document.createElement('div');
  p3.className='page';
  p3.innerHTML=pageHeader('GAME REPORT',profile,data.generatedAt)
    +'<div class="section-label">VS LEFT-HANDED VS RIGHT-HANDED BATTERS</div>'
    +handHeatMapsHTML(game.vsLHB,game.vsRHB)
    +pageFooter(3,3);
  pages.appendChild(p3);
  document.getElementById('report-info').textContent=
    'GAME REPORT — '+(profile?profile.name:'')
    +' — '+formatDate(data.generatedAt);
}
function buildBundlesReport(data){
  const allGames=data.games||[];
  const profile=data.profile;
  const pages=document.getElementById('pages');
  if(allGames.length<2){
    const p=document.createElement('div');
    p.className='page';
    p.innerHTML=pageHeader('BUNDLES REPORT',profile,data.generatedAt)
      +'<div style="padding:40px;text-align:center;color:#991b1b;">Play at least 2 games to generate bundle report.</div>';
    pages.appendChild(p);
    return;
  }
  const bundles=[];
  for(let i=0;i<allGames.length;i+=10) bundles.push(allGames.slice(i,i+10));
  // Page 1: Strikeout rate chart + Pitch mix chart
  const p1=document.createElement('div');
  p1.className='page';
  const soCanvas=document.createElement('canvas');
  soCanvas.style.cssText='width:100%;max-height:180px;';
  const pmCanvas=document.createElement('canvas');
  pmCanvas.style.cssText='width:100%;max-height:180px;';
  const p1hdr=document.createElement('div');
  p1hdr.innerHTML=pageHeader('BUNDLES REPORT',profile,data.generatedAt);
  p1.appendChild(p1hdr);
  const soLabel=document.createElement('div');
  soLabel.className='section-label';
  soLabel.textContent='STRIKEOUT RATE PER GAME';
  p1.appendChild(soLabel);
  p1.appendChild(soCanvas);
  const pmLabel=document.createElement('div');
  pmLabel.className='section-label';
  pmLabel.textContent='PITCH MIX BY BUNDLE';
  p1.appendChild(pmLabel);
  p1.appendChild(pmCanvas);
  const p1ftr=document.createElement('div');
  p1ftr.innerHTML=pageFooter(1,4);
  p1.appendChild(p1ftr);
  pages.appendChild(p1);
  // Render charts after DOM is ready
  setTimeout(function(){
    new Chart(soCanvas,{
      type:'line',
      data:{
        labels:allGames.map(function(g,i){return 'G'+(i+1);}),
        datasets:[{
          label:'Strikeouts',
          data:allGames.map(function(g){return g.strikeouts||0;}),
          borderColor:'#166534',backgroundColor:'rgba(22,101,52,0.1)',
          borderWidth:2,pointBackgroundColor:'#166534',tension:0.3,fill:true
        }]
      },
      options:{responsive:true,plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,ticks:{color:'#0c4a6e'}},x:{ticks:{color:'#0c4a6e'}}}}
    });
    const allPitchTypes={};
    allGames.forEach(function(g){Object.keys(g.pitchMix||{}).forEach(function(pk){allPitchTypes[pk]=true;});});
    const ptList=Object.keys(allPitchTypes);
    new Chart(pmCanvas,{
      type:'bar',
      data:{
        labels:bundles.map(function(b,i){return 'Bundle '+(i+1)+' ('+b.length+'g)';}),
        datasets:ptList.map(function(pk){
          return{
            label:pk,
            data:bundles.map(function(bundle){
              const total=bundle.reduce(function(s,g){return s+Object.values(g.pitchMix||{}).reduce(function(a,b){return a+b;},0);},0)||1;
              return Math.round(bundle.reduce(function(s,g){return s+((g.pitchMix||{})[pk]||0);},0)/total*100);
            }),
            backgroundColor:PITCH_COLORS[pk]||'#475569'
          };
        })
      },
      options:{responsive:true,
        plugins:{legend:{position:'bottom',labels:{color:'#0c4a6e',boxWidth:10}}},
        scales:{x:{ticks:{color:'#0c4a6e'}},y:{beginAtZero:true,max:100,ticks:{color:'#0c4a6e',callback:function(v){return v+'%';}}}}}
    });
  },500);
  // Page 2: Zone heat maps per bundle + First pitch tendencies
  const p2=document.createElement('div');
  p2.className='page';
  const hmHTML=bundles.map(function(bundle,bi){
    const zoneAgg={};
    bundle.forEach(function(g){Object.entries(g.zoneMap||{}).forEach(function(e){zoneAgg[e[0]]=(zoneAgg[e[0]]||0)+e[1];});});
    return '<div>'
      +'<div class="heat-title">BUNDLE '+(bi+1)+' ('+bundle.length+' games)</div>'
      +zoneHeatMapHTML(zoneAgg)
      +'</div>';
  }).join('');
  // First pitch table
  const fpTypes={};
  allGames.forEach(function(g){Object.keys(g.firstPitches||{}).forEach(function(pk){fpTypes[pk]=true;});});
  const fpTableHTML='<div style="display:grid;grid-template-columns:1fr repeat('+bundles.length+',1fr);gap:4px;">'
    +'<div style="font-size:8px;font-weight:700;color:#0c4a6e;">PITCH</div>'
    +bundles.map(function(b,i){return '<div style="font-size:8px;font-weight:700;color:#0c4a6e;text-align:center;">B'+(i+1)+'</div>';}).join('')
    +Object.keys(fpTypes).map(function(pk){
      return '<div style="font-size:8px;font-weight:700;color:#0c4a6e;">'+pk+'</div>'
        +bundles.map(function(bundle){
          const total=bundle.reduce(function(s,g){return s+Object.values(g.firstPitches||{}).reduce(function(a,b){return a+b;},0);},0)||1;
          const cnt=bundle.reduce(function(s,g){return s+((g.firstPitches||{})[pk]||0);},0);
          return '<div style="font-size:8px;text-align:center;color:#0c4a6e;">'+Math.round(cnt/total*100)+'%</div>';
        }).join('');
    }).join('')
    +'</div>';
  p2.innerHTML=pageHeader('BUNDLES REPORT',profile,data.generatedAt)
    +'<div class="section-label">ZONE DISTRIBUTION BY BUNDLE</div>'
    +'<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;">'+hmHTML+'</div>'
    +'<div class="section-label">FIRST PITCH TENDENCIES BY BUNDLE</div>'
    +fpTableHTML
    +pageFooter(2,3);
  pages.appendChild(p2);
  // Page 3: VS LHB/RHB + Strikeout pitch selection
  const vsLHB={zoneMap:{}},vsRHB={zoneMap:{}};
  allGames.forEach(function(g){
    Object.entries((g.vsLHB||{}).zoneMap||{}).forEach(function(e){vsLHB.zoneMap[e[0]]=(vsLHB.zoneMap[e[0]]||0)+e[1];});
    Object.entries((g.vsRHB||{}).zoneMap||{}).forEach(function(e){vsRHB.zoneMap[e[0]]=(vsRHB.zoneMap[e[0]]||0)+e[1];});
  });
  const soAll={};
  allGames.forEach(function(g){Object.entries(g.outcomes||{}).forEach(function(e){if(e[1]['STRIKEOUT'])soAll[e[0]]=(soAll[e[0]]||0)+e[1]['STRIKEOUT'];});});
  const soAllTotal=Object.values(soAll).reduce(function(a,b){return a+b;},0)||1;
  const p3=document.createElement('div');
  p3.className='page';
  p3.innerHTML=pageHeader('BUNDLES REPORT',profile,data.generatedAt)
    +'<div class="section-label">VS LEFT-HANDED VS RIGHT-HANDED BATTERS</div>'
    +handHeatMapsHTML(vsLHB,vsRHB)
    +'<div class="section-label">STRIKEOUT PITCH SELECTION</div>'
    +Object.entries(soAll).sort(function(a,b){return b[1]-a[1];}).map(function(e){
      const pk=e[0],cnt=e[1],pct=Math.round(cnt/soAllTotal*100);
      return '<div class="pitch-row">'
        +'<div class="pitch-label">'+pk+'</div>'
        +'<div class="pitch-bar-wrap"><div class="pitch-bar-fill" style="width:'+pct+'%;background:'+(PITCH_COLORS[pk]||'#334155')+'"></div></div>'
        +'<div class="pitch-pct">'+cnt+' K ('+pct+'%)</div>'
        +'</div>';
    }).join('')
    +pageFooter(3,4);
  pages.appendChild(p3);
  // Page 4: Trends & Evolution
  const p4b=document.createElement('div');
  p4b.className='page';
  const mlConf=data.mlWeights?data.mlWeights.confidence:0;
  let windowSize;
  let windowLabel;
  if(mlConf>=0.60){windowSize=3;windowLabel='Last 3 games vs career average (HIGH adaptation)';}
  else if(mlConf>=0.30){windowSize=5;windowLabel='Last 5 games vs career average (MEDIUM adaptation)';}
  else{windowSize=Math.max(1,Math.floor(allGames.length/2));windowLabel='First half vs second half (LOW adaptation)';}
  const recentGames=allGames.slice(-windowSize);
  const baselineGames=allGames.slice(0,-windowSize);
  let trendsHTML=pageHeader('BUNDLES REPORT',profile,data.generatedAt)
    +'<div class="section-label">TRENDS & EVOLUTION</div>';
  if(baselineGames.length===0){
    trendsHTML+='<div style="font-size:9px;color:#475569;padding:8px;">Play more games to see trend analysis.</div>';
  } else {
    // Pattern Intelligence Score
    function aggCT(games){
      const agg={};
      games.forEach(function(g){
        Object.entries(g.countTendencies||{}).forEach(function(e){
          if(!agg[e[0]]) agg[e[0]]={};
          Object.entries(e[1]).forEach(function(pe){agg[e[0]][pe[0]]=(agg[e[0]][pe[0]]||0)+pe[1];});
        });
      });
      return agg;
    }
    function topPPct(ctData){
      if(!ctData) return {pk:'',pct:0};
      const total=Object.values(ctData).reduce(function(a,b){return a+b;},0)||1;
      const top=Object.entries(ctData).sort(function(a,b){return b[1]-a[1];})[0];
      return top?{pk:top[0],pct:Math.round(top[1]/total*100)}:{pk:'',pct:0};
    }
    function zoneScore(games){
      const zm={};
      games.forEach(function(g){Object.entries(g.zoneMap||{}).forEach(function(e){zm[e[0]]=(zm[e[0]]||0)+e[1];});});
      const total=Object.values(zm).reduce(function(a,b){return a+b;},0)||1;
      return ['TL','TM','TR','ML','MM','MR','BL','BM','BR'].filter(function(z){return (zm[z]||0)/total>0.05;}).length;
    }
    function seqScore(games){
      const seqs={};
      games.forEach(function(g){Object.entries(g.sequences||{}).forEach(function(e){seqs[e[0]]=(seqs[e[0]]||0)+e[1];});});
      const total=Object.values(seqs).reduce(function(a,b){return a+b;},0)||1;
      const top=Object.values(seqs).sort(function(a,b){return b-a;})[0]||0;
      return Math.round((1-top/total)*100);
    }
    function veloScore(games){
      const velos=[];
      games.forEach(function(g){(g.velocities||[]).forEach(function(v){if(v>0)velos.push(v);});});
      if(velos.length<2) return 0;
      const mean=velos.reduce(function(a,b){return a+b;},0)/velos.length;
      const std=Math.sqrt(velos.reduce(function(s,v){return s+(v-mean)*(v-mean);},0)/velos.length);
      return Math.min(100,Math.round(std/mean*500));
    }
    function calcScore(games){
      if(!games.length) return 0;
      const ctA=aggCT(games);
      let cs=25;
      ['0-0','0-2','1-0','3-2'].forEach(function(ct){
        const t=topPPct(ctA[ct]);
        if(t.pct>=70) cs-=6; else if(t.pct>=55) cs-=3;
      });
      return Math.max(0,cs)+Math.min(25,Math.round(zoneScore(games)/9*25))
        +Math.min(25,Math.round(seqScore(games)/100*25))
        +Math.min(25,Math.round(veloScore(games)/100*25));
    }
    const recentScore=calcScore(recentGames);
    const baselineScore=calcScore(baselineGames);
    const scoreDiff=recentScore-baselineScore;
    const scoreColor=scoreDiff>=0?'#166534':'#991b1b';
    const scoreBg=scoreDiff>=0?'#f0fff4':'#fff1f0';
    trendsHTML+='<div style="background:'+scoreBg+';border:2px solid '+scoreColor
      +';border-radius:8px;padding:12px;margin-bottom:10px;">'
      +'<div style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;color:#0c4a6e;letter-spacing:2px;">PATTERN INTELLIGENCE SCORE</div>'
      +'<div style="font-family:\'Bebas Neue\',sans-serif;font-size:36px;color:'+scoreColor+';">'
      +recentScore+'<span style="font-size:14px;font-weight:700;"> '+(scoreDiff>=0?'↑ +':'↓ ')+scoreDiff+' from baseline</span></div>'
      +'<div style="font-size:8px;color:#475569;">'+windowLabel+'</div>'
      +'<div style="font-size:8px;font-weight:700;color:#0c4a6e;">ML ADAPTATION: '
      +(mlConf>=0.60?'HIGH':mlConf>=0.30?'MEDIUM':'LOW')+' ('+Math.round(mlConf*100)+'% confidence)</div>'
      +'</div>';
    // Regression alert
    if(scoreDiff<=-10){
      trendsHTML+='<div style="background:#991b1b;border-radius:6px;padding:10px;margin-bottom:8px;">'
        +'<div style="font-family:\'Bebas Neue\',sans-serif;font-size:14px;color:#fff;letter-spacing:2px;">🚨 REGRESSION DETECTED</div>'
        +'<div style="font-size:8px;color:#fecaca;">Your pitching patterns have become MORE predictable in recent games. Adjust immediately.</div>'
        +'</div>';
    }
    // Count trend
    trendsHTML+='<div style="font-size:8px;font-weight:700;color:#0c4a6e;margin:8px 0 4px 0;text-transform:uppercase;letter-spacing:1px;">COUNT PREDICTABILITY TREND</div>';
    const baseCT=aggCT(baselineGames);
    const recentCT=aggCT(recentGames);
    ['0-0','0-1','0-2','1-0','1-2','2-2','3-2'].forEach(function(ct){
      const bTop=topPPct(baseCT[ct]);
      const rTop=topPPct(recentCT[ct]);
      if(!bTop.pk&&!rTop.pk) return;
      const improving=rTop.pct<bTop.pct;
      trendsHTML+='<div style="padding:4px 6px;border-radius:4px;margin-bottom:3px;background:'
        +(improving?'#f0fff4':'#fff1f0')+';">'
        +'<span style="font-size:8px;font-weight:700;color:#0c4a6e;">'+ct+' — '+(bTop.pk||'?')+'</span> '
        +'<span style="font-size:8px;color:#475569;">Baseline: '+bTop.pct+'%</span> '
        +'<span style="font-size:8px;font-weight:700;color:'+(improving?'#166534':'#991b1b')+'">'
        +(improving?'↓ ':'↑ ')+'Recent: '+rTop.pct+'% '+(improving?'✓ IMPROVING':'⚠ REGRESSING')+'</span>'
        +'</div>';
    });
    // Zone, sequence, velocity trends
    const bz=zoneScore(baselineGames),rz=zoneScore(recentGames);
    const bs=seqScore(baselineGames),rs=seqScore(recentGames);
    const bv=veloScore(baselineGames),rv=veloScore(recentGames);
    trendsHTML+='<div style="font-size:8px;font-weight:700;color:#0c4a6e;margin:8px 0 4px 0;text-transform:uppercase;letter-spacing:1px;">OTHER TRENDS</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">'
      +['Zone Coverage','Sequence Variety','Velocity Variation'].map(function(label,i){
        const base=[bz,bs,bv][i];
        const recent=[rz,rs,rv][i];
        const unit=i===0?'/9':'%';
        const improving=recent>=base;
        return '<div style="background:'+(improving?'#f0fff4':'#fff1f0')+';border-radius:4px;padding:6px;">'
          +'<div style="font-size:7px;font-weight:700;color:#0c4a6e;">'+label.toUpperCase()+'</div>'
          +'<div style="font-size:8px;color:#475569;">Baseline: '+base+unit+'</div>'
          +'<div style="font-size:8px;font-weight:700;color:'+(improving?'#166534':'#991b1b')+'">'
          +(improving?'↑ ':'↓ ')+'Recent: '+recent+unit+'</div>'
          +'</div>';
      }).join('')
      +'</div>';
  }
  trendsHTML+=pageFooter(4,4);
  p4b.innerHTML=trendsHTML;

}

  };
  const countGoalColors={
    'GET AHEAD':'#0891b2','HITTER COUNT':'#991b1b',
    'EVEN':'#ca8a04','STAY AHEAD':'#166534','FINISH':'#7c3aed'
  };
  const twoStrikeCounts=['0-2','1-2','2-2','3-2'];
  // Aggregate data
  const aggCT={},aggCO={},aggCPZO={};
  allGames.forEach(function(g){
    Object.entries(g.countTendencies||{}).forEach(function(e){
      if(!aggCT[e[0]]) aggCT[e[0]]={};
      Object.entries(e[1]).forEach(function(pe){aggCT[e[0]][pe[0]]=(aggCT[e[0]][pe[0]]||0)+pe[1];});
    });
    Object.entries(g.countOutcomes||{}).forEach(function(e){
      if(!aggCO[e[0]]) aggCO[e[0]]={};
      Object.entries(e[1]).forEach(function(oe){aggCO[e[0]][oe[0]]=(aggCO[e[0]][oe[0]]||0)+oe[1];});
    });
    Object.entries(g.countPitchZoneOutcomes||{}).forEach(function(e){
      const ct=e[0];
      if(!aggCPZO[ct]) aggCPZO[ct]={};
      Object.entries(e[1]).forEach(function(pe){
        const pk=pe[0];
        if(!aggCPZO[ct][pk]) aggCPZO[ct][pk]={};
        Object.entries(pe[1]).forEach(function(oe){
          if(!aggCPZO[ct][pk][oe[0]]) aggCPZO[ct][pk][oe[0]]={};
          Object.entries(oe[1]).forEach(function(ze){
            aggCPZO[ct][pk][oe[0]][ze[0]]=(aggCPZO[ct][pk][oe[0]][ze[0]]||0)+ze[1];
          });
        });
      });
    });
  });
  // Sort counts by total pitches — show most-pitched counts first
  const allCounts=['0-0','0-1','0-2','1-0','1-1','1-2','2-0','2-1','2-2','3-0','3-1','3-2'];
  const countsSorted=allCounts.slice().sort(function(a,b){
    const ta=Object.values(aggCT[a]||{}).reduce(function(s,v){return s+v;},0);
    const tb=Object.values(aggCT[b]||{}).reduce(function(s,v){return s+v;},0);
    return tb-ta;
  });
  // Build SVG tree for a count (static version for PDF)
  function buildStaticTree(ct){
    const ctData=aggCT[ct]||{};
    const ctOutcomes=aggCO[ct]||{};
    const totalFromCount=Object.values(ctData).reduce(function(a,b){return a+b;},0);
    const isFinish=twoStrikeCounts.includes(ct);
    const goal=countGoalMap[ct]||'';
    const goalColor=countGoalColors[goal]||'#0c4a6e';
    const topPitches=Object.entries(ctData).sort(function(a,b){return b[1]-a[1];}).slice(0,4);
    const svgW=600;
    const svgH=380;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 '+svgW+' '+svgH);
    svg.setAttribute('width','100%');
    svg.style.cssText='max-width:100%;font-family:DM Mono,monospace;';
    function st(x,y,text,size,color,weight,anchor){
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',x);t.setAttribute('y',y);
      t.setAttribute('text-anchor',anchor||'middle');
      t.setAttribute('font-size',size||10);
      t.setAttribute('fill',color||'#fff');
      t.setAttribute('font-weight',weight||'700');
      t.setAttribute('font-family','DM Mono,monospace');
      t.textContent=text;
      return t;
    }
    if(totalFromCount===0){
      svg.appendChild(st(svgW/2,svgH/2,'No data for '+ct+' count',10,'#475569','400'));
      return svg;
    }
    // Root node
    const rx=svgW/2,ry=45,rr=32;
    const rc=document.createElementNS('http://www.w3.org/2000/svg','circle');
    rc.setAttribute('cx',rx);rc.setAttribute('cy',ry);rc.setAttribute('r',rr);
    rc.setAttribute('fill','#0c4a6e');rc.setAttribute('stroke','#bae6fd');rc.setAttribute('stroke-width','2');
    svg.appendChild(rc);
    svg.appendChild(st(rx,ry-6,ct,13,'#fff','700'));
    svg.appendChild(st(rx,ry+6,'COUNT',7,'#bae6fd','400'));
    svg.appendChild(st(rx,ry+16,totalFromCount+' pitches',6,'#93c5fd','400'));
    // Goal badge
    const gb=document.createElementNS('http://www.w3.org/2000/svg','rect');
    gb.setAttribute('x',rx-38);gb.setAttribute('y',ry+rr+3);
    gb.setAttribute('width',76);gb.setAttribute('height',14);
    gb.setAttribute('rx',3);gb.setAttribute('fill',goalColor);
    svg.appendChild(gb);
    svg.appendChild(st(rx,ry+rr+13,goal,6,'#fff','700'));
    // Pitch nodes
    const pitchY=160;
    const spacing=svgW/(topPitches.length+1);
    topPitches.forEach(function(pe,pi){
      const pk=pe[0],cnt=pe[1];
      const pct=Math.round(cnt/totalFromCount*100);
      const px=spacing*(pi+1);
      const pr=Math.max(18,Math.min(30,pct/2+14));
      const pColor=CBCOLORS[pk]||'#334155';
      // Line root to pitch
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',rx);l.setAttribute('y1',ry+rr);
      l.setAttribute('x2',px);l.setAttribute('y2',pitchY-pr);
      l.setAttribute('stroke','#bae6fd');l.setAttribute('stroke-width','1');
      l.setAttribute('stroke-dasharray','3,2');
      svg.appendChild(l);
      // Pitch circle
      const pc=document.createElementNS('http://www.w3.org/2000/svg','circle');
      pc.setAttribute('cx',px);pc.setAttribute('cy',pitchY);
      pc.setAttribute('r',pr);pc.setAttribute('fill',pColor);
      pc.setAttribute('stroke','#fff');pc.setAttribute('stroke-width','1.5');
      svg.appendChild(pc);
      svg.appendChild(st(px,pitchY-4,pk,10,'#fff','700'));
      svg.appendChild(st(px,pitchY+8,pct+'%',8,'rgba(255,255,255,0.85)','400'));
      // Outcome nodes
      const grouped={K:0,FOUL:0,BALL:0,HIT:0,PLAY:0};
      Object.entries(ctOutcomes).forEach(function(e){
        const o=e[0],v=e[1];
        const frac=cnt/totalFromCount;
        const est=Math.round(v*frac);
        if(o==='STRIKEOUT'||o==='CALLED STRIKE'||o==='SWING & MISS'||o==='CHECK SWING (STRIKE)') grouped.K+=est;
        else if(o.startsWith('FOUL')) grouped.FOUL+=est;
        else if(o==='BALL'||o==='CALLED BALL') grouped.BALL+=est;
        else if(o==='SINGLE'||o==='DOUBLE'||o==='TRIPLE'||o==='HOME RUN') grouped.HIT+=est;
        else if(o==='GROUND OUT'||o==='POP FLY') grouped.PLAY+=est;
      });
      const gTotal=Object.values(grouped).reduce(function(a,b){return a+b;},0)||1;
      const active=Object.entries(grouped).filter(function(e){return e[1]>0;});
      const oSpacing=36;
      const oStartX=px-(active.length-1)*oSpacing/2;
      const outcomeY=260;
      const kLabel=isFinish?'K':'S';
      active.forEach(function(oe,oi){
        const oType=oe[0],oCount=oe[1];
        const oPct=Math.round(oCount/gTotal*100);
        const ox=oStartX+oi*oSpacing;
        const oColor=outcomeColors[oType]||'#334155';
        const ol=document.createElementNS('http://www.w3.org/2000/svg','line');
        ol.setAttribute('x1',px);ol.setAttribute('y1',pitchY+pr);
        ol.setAttribute('x2',ox);ol.setAttribute('y2',outcomeY-10);
        ol.setAttribute('stroke',oColor);ol.setAttribute('stroke-width','1');
        ol.setAttribute('opacity','0.5');
        svg.appendChild(ol);
        const ss=9;
        if(oType==='K'){
          const sp=[];
          for(let si=0;si<10;si++){
            const a=(si*Math.PI/5)-Math.PI/2;
            const r=si%2===0?ss:ss*0.45;
            sp.push((ox+r*Math.cos(a)).toFixed(1)+','+(outcomeY+r*Math.sin(a)).toFixed(1));
          }
          const star=document.createElementNS('http://www.w3.org/2000/svg','polygon');
          star.setAttribute('points',sp.join(' '));star.setAttribute('fill',oColor);
          svg.appendChild(star);
        } else if(oType==='FOUL'){
          const d=document.createElementNS('http://www.w3.org/2000/svg','polygon');
          d.setAttribute('points',ox+','+(outcomeY-ss)+' '+(ox+ss)+','+outcomeY+' '+ox+','+(outcomeY+ss)+' '+(ox-ss)+','+outcomeY);
          d.setAttribute('fill',oColor);svg.appendChild(d);
        } else if(oType==='BALL'){
          const bc=document.createElementNS('http://www.w3.org/2000/svg','circle');
          bc.setAttribute('cx',ox);bc.setAttribute('cy',outcomeY);bc.setAttribute('r',ss);
          bc.setAttribute('fill',oColor);svg.appendChild(bc);
        } else if(oType==='HIT'){
          const t=document.createElementNS('http://www.w3.org/2000/svg','polygon');
          t.setAttribute('points',ox+','+(outcomeY-ss)+' '+(ox+ss)+','+(outcomeY+ss)+' '+(ox-ss)+','+(outcomeY+ss));
          t.setAttribute('fill',oColor);svg.appendChild(t);
        } else {
          const sq=document.createElementNS('http://www.w3.org/2000/svg','rect');
          sq.setAttribute('x',ox-ss);sq.setAttribute('y',outcomeY-ss);
          sq.setAttribute('width',ss*2);sq.setAttribute('height',ss*2);
          sq.setAttribute('rx',2);sq.setAttribute('fill',oColor);svg.appendChild(sq);
        }
        svg.appendChild(st(ox,outcomeY-ss-3,oPct+'%',7,'#334155','600'));
      });
    });
    // Legend — top right
    const legendItems=[
      {label:isFinish?'Strikeout':'Strike',color:'#166534',type:'K'},
      {label:'Foul',color:'#ca8a04',type:'FOUL'},
      {label:'Ball',color:'#64748b',type:'BALL'},
      {label:'Hit',color:'#991b1b',type:'HIT'},
      {label:'In Play',color:'#1d4ed8',type:'PLAY'}
    ];
    const lx=svgW-110,lsy=16,lrh=18;
    const lbg=document.createElementNS('http://www.w3.org/2000/svg','rect');
    lbg.setAttribute('x',lx-6);lbg.setAttribute('y',lsy-10);
    lbg.setAttribute('width',112);lbg.setAttribute('height',legendItems.length*lrh+8);
    lbg.setAttribute('rx',4);lbg.setAttribute('fill','#f0f9ff');
    lbg.setAttribute('stroke','#bae6fd');lbg.setAttribute('stroke-width','1');
    svg.appendChild(lbg);
    legendItems.forEach(function(item,i){
      const ly=lsy+i*lrh;
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',lx+6);dot.setAttribute('cy',ly);dot.setAttribute('r',5);
      dot.setAttribute('fill',item.color);svg.appendChild(dot);
      const lt=document.createElementNS('http://www.w3.org/2000/svg','text');
      lt.setAttribute('x',lx+16);lt.setAttribute('y',ly+4);
      lt.setAttribute('text-anchor','start');lt.setAttribute('font-size',8);
      lt.setAttribute('fill',item.color);lt.setAttribute('font-weight','700');
      lt.setAttribute('font-family','DM Mono,monospace');
      lt.textContent=item.label;svg.appendChild(lt);
    });
    return svg;
  }
  // Build pages — one tree per page
  const totalPages=countsSorted.length;
  countsSorted.forEach(function(ct,pi){
    const total=Object.values(aggCT[ct]||{}).reduce(function(a,b){return a+b;},0);
    const p=document.createElement('div');
    p.className='page';
    const goalColor=countGoalColors[countGoalMap[ct]||'']||'#0c4a6e';
    const hdrDiv=document.createElement('div');
    hdrDiv.innerHTML=pageHeader('SEQUENCES REPORT',profile,data.generatedAt);
    p.appendChild(hdrDiv);
    // Count title
    const ctTitle=document.createElement('div');
    ctTitle.style.cssText='font-family:\'Bebas Neue\',sans-serif;font-size:18px;'
      +'color:'+goalColor+';letter-spacing:2px;margin:8px 0 4px 0;';
    ctTitle.textContent=ct+' COUNT — '+total+' pitches — '+countGoalMap[ct];
    p.appendChild(ctTitle);
    // Tree — full width
    const treeBox=document.createElement('div');
    treeBox.style.cssText='border:2px solid '+goalColor+';border-radius:8px;padding:12px;width:100%;';
    const tree=buildStaticTree(ct);
    // Make tree full width
    tree.setAttribute('width','100%');
    tree.setAttribute('viewBox','0 0 600 380');
    treeBox.appendChild(tree);
    p.appendChild(treeBox);
    const ftrDiv=document.createElement('div');
    ftrDiv.innerHTML=pageFooter(pi+1,totalPages);
    p.appendChild(ftrDiv);
    pages.appendChild(p);
  });
  document.getElementById('report-info').textContent=
    'SEQUENCES REPORT — '+(profile?profile.name:'')
    +' — '+allGames.length+' games — '+formatDate(data.generatedAt);
}
// Main
window.onload=function(){
  try{
    const raw=localStorage.getItem('pitchseq-report-export');
    if(!raw){
      document.getElementById('pages').innerHTML='<div style="padding:40px;text-align:center;color:#991b1b;">No report data found. Please export from the app.</div>';
      return;
    }
    const data=JSON.parse(raw);
    const tab=getParam('tab')||data.tab||'game';
    if(tab==='game') buildGameReport(data);
    else if(tab==='bundles') buildBundlesReport(data);
    else if(tab==='career') buildCareerReport(data);
    else if(tab==='sequences') buildSequencesReport(data);
  }catch(e){
    document.getElementById('pages').innerHTML='<div style="padding:40px;text-align:center;color:#991b1b;">Error loading report: '+e.message+'</div>';
  }
};
</script>
</body>
</html>
